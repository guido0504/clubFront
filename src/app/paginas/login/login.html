<title>Iniciar Sesión</title>
<body>
    <div class="contenedor-principal">
        <div class="logo-nuevo">   <!-- Contenedor Logo -->
            
            <a href="#" (click)="('/')">  <!-- Click en el logo para regresar a Inicio -->
                <img src="./img/logoNuevo2.png" alt="logo centro de fomento" class="animacion-resplandor">
            </a>
        </div>

        <div class="login-container">
            <div class="login-header">
                <h1>Bienvenido de nuevo</h1>
                <p>Por favor, ingresa tus datos para continuar.</p>
            </div>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu-correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-button">Iniciar Sesión</button>
            </form>
            <div class="forgot-password">
                <a href="#">¿Olvidaste tu contraseña?</a>
                
                <!-- Botón para regresar a Inicio -->
                <a href="#" class="back-button">Regresar a Inicio</a>
                <!-- <a routerLink="#" class="back-button">Regresar a Inicio</a> -->
            </div>

            </div>

        
    </div>

        
    

</body>
